<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAPAN 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --line:#E4E2DF; --ink:#141414; --mute:#6A6663; --soft:#F1EFED;
  --accent:#6B1E2E; --accent-ink:#FFFFFF; --danger:#8F1D2C; --scrim:rgba(20,20,20,.45);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#1C1C1C; --line:#2F2D2C; --ink:#F2F0EE; --mute:#A09B96; --soft:#242322;
    --accent:#C97A8B; --accent-ink:#141414; --danger:#E58A98; --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1C1C1C; --line:#2F2D2C; --ink:#F2F0EE; --mute:#A09B96; --soft:#242322;
  --accent:#C97A8B; --accent-ink:#141414; --danger:#E58A98; --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding:0 16px 80px}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:10px;margin:20px 0 4px}
.title{flex:1;min-width:0;margin:0;padding:0;border:0;background:transparent;color:var(--ink);font-family:var(--sans);font-weight:700;font-size:1.6rem;letter-spacing:-.02em;line-height:1.2;min-height:44px}
.expbtn{flex:none;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.expbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sub{margin:0 0 6px;color:var(--mute);font-size:.88rem}

nav.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 -16px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.cities{gap:22px;margin-bottom:8px}
.city{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;min-height:40px;font-size:1.1rem;font-weight:500;color:var(--mute)}
.city[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.plus{flex:none;background:none;border:1px dashed var(--line);border-radius:999px;color:var(--mute);min-height:36px;padding:0 12px;font-size:.85rem}
.pill{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.9rem;white-space:nowrap}
.pill small{color:var(--mute);margin-left:4px}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill[aria-pressed="true"] small{color:var(--bg);opacity:.7}

.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:20px 0 6px}
.head h2{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.head p{margin:2px 0 0;color:var(--mute);font-size:.85rem}
.tools{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.tbtn{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.85rem}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.82rem}
.ci{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.add{display:flex;gap:8px;margin-bottom:14px}
.add input{flex:1;min-width:0}
.add select{flex:none;width:112px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:84px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line);font-weight:500}
.btn.wide{width:100%;min-height:50px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.item.done .name{text-decoration:line-through;color:var(--mute)}
.tick{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.item.done .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item.done .tick svg{opacity:1}
.time{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;margin-right:8px;color:var(--accent)}
.name{font-weight:600;font-size:1.02rem;line-height:1.35;overflow-wrap:anywhere}
.meta{margin:3px 0 0;color:var(--mute);font-size:.84rem;display:flex;align-items:center;gap:6px}
.note{margin:6px 0 0;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.links{display:flex;gap:16px;margin-top:6px;font-size:.88rem}
.links a{color:var(--accent);text-underline-offset:3px;min-height:28px;display:inline-flex;align-items:center}
.side{display:flex;flex-direction:column;gap:4px;align-items:center}
.mini{width:44px;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;font-size:.95rem;color:var(--mute)}
.mini:disabled{opacity:.3}
.maplink{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.maplink svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.maplink.guess{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.maplink:active{opacity:.85}
.empty{padding:28px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);text-align:center}

/* expenses */
.sum{background:var(--soft);border-radius:14px;padding:16px;margin:12px 0}
.sum .big{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sum .aud{color:var(--mute);margin-top:2px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.split div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.split b{display:block;font-size:.8rem;color:var(--mute);font-weight:500}
.split span{font-weight:600}
.split small{display:block;color:var(--mute)}
.rate{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:.9rem;flex-wrap:wrap}
.rate input{width:110px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.exp h3{margin:0;font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.exp .amt{text-align:right;font-weight:700}
.exp .amt small{display:block;color:var(--mute);font-weight:500}
.exp .info{color:var(--mute);font-size:.84rem}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--soft);font-size:.78rem;font-weight:600;color:var(--ink);margin-left:6px}
.thumbs{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft);padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:.8rem;line-height:1;padding:0}
.exp .edit{grid-column:1/-1;justify-self:start;color:var(--accent);background:none;border:0;padding:4px 0;min-height:32px;font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.audprev{margin:6px 0 0;color:var(--mute);font-size:.88rem}
.spent{margin:6px 0 0;font-size:.88rem;font-weight:600;color:var(--accent)}
.byplace{margin:0 0 16px}
.byplace h3{margin:0 0 4px;font-size:.95rem;font-weight:700}
.bp{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.bp span:last-child{text-align:right;white-space:nowrap;font-weight:600}
.bp small{display:block;color:var(--mute);font-weight:400}
.forplace{color:var(--ink);font-size:.86rem;margin-top:2px}
.viewer img{width:100%;max-height:70vh;object-fit:contain;border-radius:10px;background:var(--soft)}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.sheet h3{margin:0 0 12px;font-size:1.2rem;font-weight:700}
.sheet label.l{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.actions .spacer{margin-right:auto}
.hint{font-size:.82rem;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
var KEY="japan-trip-planner-v2", OLD="japan-trip-planner-v1";
var CATS={
  eat:["Eat","M6 3v6a2 2 0 0 0 4 0V3M8 3v18M17 21V3c-2.2 1.4-3.2 4-3.2 7s1 4.2 3.2 4.5"],
  sweets:["Sweets","M4 20h16M5.5 20v-6h13v6M5.5 14c1.6-1.2 2.6 1 3.8 0s2.4-1 3.7 0 2.4 1 3.7 0 1.6-.8 2.3 0M12 14V9.5M12 9.5c-1.3-1-1.3-2.4 0-3.5 1.3 1.1 1.3 2.5 0 3.5z"],
  sights:["Sights","M3 6.5c4 1.2 14 1.2 18 0M5.5 10h13M7.5 10v11M16.5 10v11M12 7.5V10"],
  shop:["Shop","M5 8h14l-1 12H6L5 8zM9 8V6.5a3 3 0 0 1 6 0V8"],
  fun:["Fun","M12 3l2.4 5.6L20 11l-5.6 2.4L12 19l-2.4-5.6L4 11l5.6-2.4z"],
  stay:["Stay","M3 19V6M3 15h18v4M21 15v-2.5a2.5 2.5 0 0 0-2.5-2.5H11v5M7 12.2a1.2 1.2 0 1 0 0-.01"],
  travel:["Travel","M8 3h8a2.5 2.5 0 0 1 2.5 2.5v9A3.5 3.5 0 0 1 15 18H9a3.5 3.5 0 0 1-3.5-3.5v-9A2.5 2.5 0 0 1 8 3zM5.5 10h13M9 14h.01M15 14h.01M8 21l1.5-3M16 21l-1.5-3"]
};
function catIcon(k){var c=CATS[k]||CATS.sights;return '<svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="'+c[1]+'"/></svg>'}
var DEFAULT_RATE=113; /* JPY per 1 AUD, editable in the app */
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function seed(){
  var t=uid(),f=uid();
  return {trip:"My Japan trip",active:t,view:"ideas",mode:"plan",rate:DEFAULT_RATE,expenses:[],
    cities:[{id:t,name:"Tokyo",days:[],items:[]},{id:f,name:"Fukuoka",days:[],items:[]}]};
}
function normalize(o){
  if(!o||!o.cities||!o.cities.length)return seed();
  if(!o.trip)o.trip="My Japan trip";
  if(!o.rate||o.rate<=0)o.rate=DEFAULT_RATE;
  if(!o.expenses)o.expenses=[];
  o.mode="plan"; if(!o.view)o.view="ideas";
  o.cities.forEach(function(c){(c.items||[]).forEach(function(i){if(i.cat==="roam")i.cat="sights";if(i.map==null)i.map=""})});
  return o;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r))}catch(e){}
  try{ /* bring over anything from the first version, keeping only Tokyo and Fukuoka */
    var r1=localStorage.getItem(OLD);
    if(r1){
      var o=JSON.parse(r1);
      o.cities=(o.cities||[]).filter(function(c){return !/^(kyoto|osaka)$/i.test(c.name)});
      o.cities.forEach(function(c){c.items=(c.items||[]).filter(function(i){return !/^Example idea/.test(i.note||"")})});
      if(!o.cities.some(function(c){return /^fukuoka$/i.test(c.name)}))o.cities.push({id:uid(),name:"Fukuoka",days:[],items:[]});
      if(!o.cities.some(function(c){return c.id===o.active}))o.active=o.cities[0].id;
      return normalize(o);
    }
  }catch(e){}
  return seed();
}
var PRESET={"trip":"JAPAN 2027","active":"q4xdvhlygg","view":"ideas","mode":"plan","rate":113,"expenses":[],"cities":[{"id":"dt8mvukygg","name":"Tokyo","days":[],"items":[]},{"id":"q4xdvhlygg","name":"Fukuoka","days":[],"items":[{"id":"m4ycufz88l","title":"\u307e\u3059\u3068\u307f \u5929\u795e\u5e97","cat":"eat","time":"","note":"Buri shabu","url":"","map":"https://maps.app.goo.gl/Tk5Jrf2WYt4m3U4A8?g_st=ac","day":null,"done":false}]}]};
function hasData(o){var n=0;(o.cities||[]).forEach(function(c){n+=(c.items||[]).length});return n>0||(o.expenses||[]).length>0}
function pick(o){return hasData(o)?o:normalize(JSON.parse(JSON.stringify(PRESET)))}
var S=pick(load()), filter=null, modal=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function city(){
  for(var i=0;i<S.cities.length;i++)if(S.cities[i].id===S.active)return S.cities[i];
  S.active=S.cities[0].id;return S.cities[0];
}
function dayOf(c,id){for(var i=0;i<c.days.length;i++)if(c.days[i].id===id)return c.days[i];return null}
function viewKey(c){return (S.view!=="ideas"&&dayOf(c,S.view))?S.view:"ideas"}
function fmtDate(d){
  if(!d)return "";
  var p=d.split("-");if(p.length!==3)return d;
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
function cleanMap(v){
  v=(v||"").trim(); if(!v)return "";
  var u=v.match(/https?:\/\/\S+/i);
  if(u)return u[0];
  v=v.replace(/\s+/g,"");
  return /^https?:\/\//i.test(v)?v:"https://"+v;
}
function mapUrl(it,c){
  var m=cleanMap(it.map);
  if(m)return m;
  return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(it.title+" "+c.name+" Japan");
}
function safeUrl(u){u=(u||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;return u}
function yen(n){return "\u00A5"+Math.round(n).toLocaleString("en-US")}
function aud(n){return "A$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}

/* ---------- photo storage (IndexedDB) ---------- */
var dbp=null, urls={};
function db(){
  if(!dbp)dbp=new Promise(function(res,rej){
    try{var r=indexedDB.open("jtp-photos",1);
      r.onupgradeneeded=function(){r.result.createObjectStore("p")};
      r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}
  });
  return dbp;
}
function idb(mode,fn){
  return db().then(function(d){return new Promise(function(res,rej){
    var t=d.transaction("p",mode),req=fn(t.objectStore("p"));
    t.oncomplete=function(){res(req&&req.result)};t.onerror=function(){rej(t.error)};
  })});
}
function putPhoto(id,blob){return idb("readwrite",function(s){return s.put(blob,id)})}
function getPhoto(id){return idb("readonly",function(s){return s.get(id)})}
function delPhoto(id){delete urls[id];return idb("readwrite",function(s){return s.delete(id)}).catch(function(){})}
function compress(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var m=1600,s=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement("canvas");
      cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);
      cv.toBlob(function(b){b?res(b):rej(new Error("blob"))},"image/jpeg",.78);
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("img"))};
    im.src=u;
  });
}
function hydrate(){
  document.querySelectorAll("img[data-pid]").forEach(function(im){
    var id=im.getAttribute("data-pid");
    if(urls[id]){im.src=urls[id];return}
    getPhoto(id).then(function(b){if(b){urls[id]=URL.createObjectURL(b);im.src=urls[id]}}).catch(function(){});
  });
}

/* ---------- rendering ---------- */
var ICON_PIN='<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
var ICON_YEN='<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v5M17.5 9.5v5"/></svg>';

function totals(){
  var t={jpy:0,aud:0,card:{jpy:0,aud:0},cash:{jpy:0,aud:0}};
  S.expenses.forEach(function(e){
    var a=e.jpy/(e.rate||S.rate), k=e.pay==="cash"?"cash":"card";
    t.jpy+=e.jpy;t.aud+=a;t[k].jpy+=e.jpy;t[k].aud+=a;
  });
  return t;
}

function findAny(id){
  if(!id)return null;
  for(var i=0;i<S.cities.length;i++){var c=S.cities[i];for(var j=0;j<c.items.length;j++)if(c.items[j].id===id)return {item:c.items[j],city:c};}
  return null;
}
function spentFor(id){
  var r={jpy:0,aud:0,n:0};
  S.expenses.forEach(function(e){if(e.item===id){r.jpy+=e.jpy;r.aud+=e.jpy/(e.rate||S.rate);r.n++}});
  return r;
}
function placeOptions(sel){
  var h='<option value="">Not linked to a place</option>';
  S.cities.forEach(function(c){
    if(!c.items.length)return;
    h+='<optgroup label="'+esc(c.name)+'">';
    c.items.forEach(function(it){
      var d=it.day?dayOf(c,it.day):null;
      h+='<option value="'+it.id+'"'+(sel===it.id?' selected':'')+'>'+esc(it.title)+(d?' ('+esc(d.label)+')':'')+'</option>';
    });
    h+='</optgroup>';
  });
  return h;
}

function render(){
  var h='<div class="top"><input class="title" id="trip" value="'+esc(S.trip)+'" aria-label="Trip name">';
  if(S.mode==="expenses"){
    h+='<button class="expbtn" data-act="mode" data-id="plan">Itinerary</button></div>';
    h+=renderExpenses();
  }else{
    h+='<button class="expbtn" data-act="mode" data-id="expenses">'+ICON_YEN+'Expenses</button></div>';
    h+=renderPlan();
  }
  document.getElementById("app").innerHTML=h;
  var q=document.getElementById("qa");
  if(q)q.addEventListener("keydown",function(e){if(e.key==="Enter")act("add")});
  hydrate();
  renderModal();
}

function renderPlan(){
  var c=city(), vk=viewKey(c), day=vk==="ideas"?null:dayOf(c,vk), h="";
  h+='<p class="sub">Collect ideas first, then move them into days when plans take shape.</p>';
  h+='<nav class="bar"><div class="row cities">';
  S.cities.forEach(function(x){h+='<button class="city" data-act="city" data-id="'+x.id+'" aria-pressed="'+(x.id===c.id)+'">'+esc(x.name)+'</button>'});
  h+='<button class="plus" data-act="newcity">+ City</button></div><div class="row">';
  var ideas=c.items.filter(function(i){return !i.day}).length;
  h+='<button class="pill" data-act="view" data-id="ideas" aria-pressed="'+(vk==="ideas")+'">Ideas<small>'+ideas+'</small></button>';
  c.days.forEach(function(d,n){
    var cnt=c.items.filter(function(i){return i.day===d.id}).length;
    h+='<button class="pill" data-act="view" data-id="'+d.id+'" aria-pressed="'+(vk===d.id)+'">'+esc(d.label||("Day "+(n+1)))+'<small>'+cnt+'</small></button>';
  });
  h+='<button class="plus" data-act="newday">+ Day</button></div></nav>';

  h+='<div class="head"><div><h2>'+(day?esc(day.label):"Ideas for "+esc(c.name))+'</h2><p>'+
    (day?(fmtDate(day.date)||"No date yet"):"Places and plans not assigned to a day")+'</p></div><div class="tools">';
  if(day)h+='<button class="tbtn" data-act="sort">Sort by time</button><button class="tbtn" data-act="editday">Edit day</button>';
  h+='<button class="tbtn" data-act="editcity">City settings</button></div></div>';

  h+='<div class="filters">';
  Object.keys(CATS).forEach(function(k){
    h+='<button class="chip" data-act="filter" data-id="'+k+'" aria-pressed="'+(filter===k)+'">'+catIcon(k)+CATS[k][0]+'</button>';
  });
  h+='</div>';

  h+='<div class="add"><input id="qa" placeholder="Add a place or plan" aria-label="New item title"><select id="qc" aria-label="Category">';
  Object.keys(CATS).forEach(function(k){h+='<option value="'+k+'">'+CATS[k][0]+'</option>'});
  h+='</select><button class="btn" data-act="add">Add</button></div>';

  var list=visible(c);
  if(!list.length){
    h+='<div class="empty">'+(filter?"Nothing in this category here yet.":(vk==="ideas"?"No ideas yet. Add a place above to start your list.":"Nothing planned for this day. Add something above, or move ideas here from the Ideas tab."))+'</div>';
  }else{
    h+='<ul class="list">';
    list.forEach(function(it,idx){
      var cat=CATS[it.cat]||CATS.sights;
      h+='<li class="item'+(it.done?' done':'')+'">';
      h+='<button class="tick" data-act="done" data-id="'+it.id+'" aria-label="Mark booked or done" aria-pressed="'+!!it.done+'"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>';
      h+='<div><div class="name">'+(it.time?'<span class="time">'+esc(it.time)+'</span>':'')+esc(it.title)+'</div><p class="meta">'+catIcon(it.cat)+cat[0]+'</p>';
      if(it.note)h+='<p class="note">'+esc(it.note)+'</p>';
      var sp=spentFor(it.id);
      if(sp.n)h+='<p class="spent">Spent '+yen(sp.jpy)+' ('+aud(sp.aud)+')</p>';
      h+='<div class="links">';
      if(it.url)h+='<a href="'+esc(safeUrl(it.url))+'" target="_blank" rel="noopener noreferrer">Website</a>';
      h+='<a href="#" data-act="expfor" data-id="'+it.id+'">Add expense</a><a href="#" data-act="edit" data-id="'+it.id+'">Edit</a></div></div>';
      h+='<div class="side"><a class="maplink'+(it.map?'':' guess')+'" href="'+esc(mapUrl(it,c))+'" target="_blank" rel="noopener noreferrer" aria-label="'+(it.map?'Open saved location for ':'Search Maps for ')+esc(it.title)+'">'+ICON_PIN+'</a><button class="mini" data-act="up" data-id="'+it.id+'" aria-label="Move up"'+(idx===0?' disabled':'')+'>&uarr;</button><button class="mini" data-act="down" data-id="'+it.id+'" aria-label="Move down"'+(idx===list.length-1?' disabled':'')+'>&darr;</button></div>';
      h+='</li>';
    });
    h+='</ul>';
  }
  h+='<p class="hint" style="margin-top:22px"><a href="#" data-act="data" style="color:var(--accent)">Back up or restore your plan</a>. Your plan is saved in this browser on this device only.</p>';
  return h;
}

function renderExpenses(){
  var t=totals(), h="";
  h+='<p class="sub">Track what you spend in yen, with an approximate Australian dollar value.</p>';
  h+='<div class="sum"><div class="big">'+yen(t.jpy)+'</div><div class="aud">about '+aud(t.aud)+'</div>';
  h+='<div class="split"><div><b>Card</b><span>'+yen(t.card.jpy)+'</span><small>'+aud(t.card.aud)+'</small></div><div><b>Cash</b><span>'+yen(t.cash.jpy)+'</span><small>'+aud(t.cash.aud)+'</small></div></div></div>';
  var bp={},linked=0,unl={jpy:0,aud:0};
  S.expenses.forEach(function(e){
    var a=e.jpy/(e.rate||S.rate);
    if(e.item&&findAny(e.item)){var b=bp[e.item]||(bp[e.item]={jpy:0,aud:0});b.jpy+=e.jpy;b.aud+=a;linked++}
    else{unl.jpy+=e.jpy;unl.aud+=a}
  });
  if(linked){
    h+='<div class="byplace"><h3>Spending by place</h3>';
    Object.keys(bp).sort(function(x,y){return bp[y].jpy-bp[x].jpy}).forEach(function(id){
      var f=findAny(id);
      h+='<div class="bp"><span>'+esc(f.item.title)+'<small>'+esc(f.city.name)+'</small></span><span>'+yen(bp[id].jpy)+'<small>'+aud(bp[id].aud)+'</small></span></div>';
    });
    if(unl.jpy)h+='<div class="bp"><span>Not linked to a place</span><span>'+yen(unl.jpy)+'<small>'+aud(unl.aud)+'</small></span></div>';
    h+='</div>';
  }
  h+='<div class="rate"><label for="rate">1 AUD =</label>\u00A5<input id="rate" type="number" inputmode="decimal" step="0.01" min="1" value="'+S.rate+'" aria-label="Yen per Australian dollar"><span class="hint" style="margin:0">Applies to new expenses. Update it to a current rate before you travel.</span></div>';
  h+='<button class="btn wide" data-act="newexp" style="margin-bottom:14px">+ Add expense</button>';
  var list=S.expenses.map(function(e,i){return {e:e,i:i}}).sort(function(a,b){
    if(a.e.date!==b.e.date)return a.e.date<b.e.date?1:-1; return b.i-a.i;
  });
  if(!list.length){h+='<div class="empty">No expenses yet. Tap Add expense to log a purchase, then attach a photo of the receipt if you like.</div>';return h}
  h+='<ul class="list">';
  list.forEach(function(x){
    var e=x.e,a=e.jpy/(e.rate||S.rate);
    h+='<li class="exp"><div><h3>'+esc(e.desc||"Expense")+'</h3><div class="info">'+esc(fmtDate(e.date))+'<span class="badge">'+(e.pay==="cash"?"Cash":"Card")+'</span></div>'+(function(){var f=findAny(e.item);return f?'<div class="forplace">'+esc(f.item.title)+', '+esc(f.city.name)+'</div>':''})()+'</div>';
    h+='<div class="amt">'+yen(e.jpy)+'<small>'+aud(a)+'</small></div>';
    if(e.photos&&e.photos.length){
      h+='<div class="thumbs">';
      e.photos.forEach(function(p){h+='<button class="thumb" data-act="photo" data-id="'+p+'" aria-label="View receipt photo"><img data-pid="'+p+'" alt="Receipt"></button>'});
      h+='</div>';
    }
    h+='<button class="edit" data-act="editexp" data-id="'+e.id+'">Edit</button></li>';
  });
  h+='</ul>';
  h+='<p class="hint" style="margin-top:22px">Photos are stored in this browser on this device only and are not included in backups.</p>';
  return h;
}

/* ---------- modals ---------- */
function openModal(m){modal=m;renderModal()}
function closeModal(){
  if(modal&&modal.type==="expense"){(modal.added||[]).forEach(delPhoto)}
  modal=(modal&&modal.type==="photo"&&modal.prev)?modal.prev:null;
  renderModal();
}
function capture(){
  if(!modal||modal.type!=="expense")return;
  var d=modal.draft;
  if(document.getElementById("m-desc")){
    d.desc=val("m-desc");d.jpy=val("m-jpy");d.date=val("m-date");d.item=val("m-item");
  }
}
function renderModal(){
  var old=document.getElementById("scrim");if(old)old.remove();
  if(!modal)return;
  var c=city(), h="";
  if(modal.type==="item"){
    var it=c.items.filter(function(i){return i.id===modal.id})[0];if(!it){modal=null;return}
    h+='<h3>Edit item</h3><label class="l" for="m-title">Name</label><input id="m-title" value="'+esc(it.title)+'">';
    h+='<div class="two"><div><label class="l" for="m-cat">Category</label><select id="m-cat">';
    Object.keys(CATS).forEach(function(k){h+='<option value="'+k+'"'+(it.cat===k?' selected':'')+'>'+CATS[k][0]+'</option>'});
    h+='</select></div><div><label class="l" for="m-time">Time (optional)</label><input id="m-time" type="time" value="'+esc(it.time)+'"></div></div>';
    h+='<label class="l" for="m-where">Where</label><select id="m-where"><option value="">Ideas (no day yet)</option>';
    c.days.forEach(function(d,n){h+='<option value="'+d.id+'"'+(it.day===d.id?' selected':'')+'>'+esc(d.label||("Day "+(n+1)))+'</option>'});
    h+='</select><label class="l" for="m-note">Notes</label><textarea id="m-note">'+esc(it.note)+'</textarea>';
    h+='<label class="l" for="m-map">Google Maps link</label><input id="m-map" type="url" value="'+esc(it.map||'')+'" placeholder="Paste the link from Google Maps">';
    h+='<p class="hint">In Google Maps, open the exact branch, tap Share, then Copy link. Without a link, the pin button only searches by name.</p>';
    h+='<label class="l" for="m-url">Website link (booking, menu)</label><input id="m-url" type="url" value="'+esc(it.url)+'" placeholder="https://">';
    h+='<div class="actions"><button class="btn danger spacer" data-act="m-delitem">Delete</button><button class="btn ghost" data-act="m-close">Cancel</button><button class="btn" data-act="m-saveitem">Save</button></div>';
  }else if(modal.type==="day"){
    var d=modal.id?dayOf(c,modal.id):null;
    h+='<h3>'+(d?"Edit day":"New day")+'</h3><label class="l" for="m-label">Name</label><input id="m-label" value="'+esc(d?d.label:("Day "+(c.days.length+1)))+'">';
    h+='<label class="l" for="m-date">Date (optional)</label><input id="m-date" type="date" value="'+esc(d?d.date:"")+'">';
    h+='<div class="actions">'+(d?'<button class="btn danger spacer" data-act="m-delday">Delete day</button>':'')+'<button class="btn ghost" data-act="m-close">Cancel</button><button class="btn" data-act="m-saveday">Save</button></div>';
    if(d)h+='<p class="hint">Deleting a day moves its items back to Ideas.</p>';
  }else if(modal.type==="city"){
    var cc=modal.id?c:null;
    h+='<h3>'+(cc?"City settings":"New city")+'</h3><label class="l" for="m-name">City or area</label><input id="m-name" value="'+esc(cc?cc.name:"")+'" placeholder="e.g. Hakone, Nara, Hokkaido">';
    h+='<div class="actions">'+(cc&&S.cities.length>1?'<button class="btn danger spacer" data-act="m-delcity">Delete city</button>':'')+'<button class="btn ghost" data-act="m-close">Cancel</button><button class="btn" data-act="m-savecity">Save</button></div>';
    if(cc)h+='<p class="hint">Deleting a city removes all of its days and items.</p>';
  }else if(modal.type==="expense"){
    var dr=modal.draft;
    h+='<h3>'+(modal.id?"Edit expense":"New expense")+'</h3>';
    h+='<label class="l" for="m-desc">What was it for?</label><input id="m-desc" value="'+esc(dr.desc)+'" placeholder="e.g. Ramen lunch, Suica top-up">';
    h+='<div class="two"><div><label class="l" for="m-jpy">Amount (JPY)</label><input id="m-jpy" type="number" inputmode="numeric" min="0" step="1" value="'+esc(dr.jpy)+'" placeholder="0"></div>';
    h+='<div><label class="l" for="m-date">Date</label><input id="m-date" type="date" value="'+esc(dr.date)+'"></div></div>';
    h+='<p class="audprev" id="m-aud">'+audPreview(dr.jpy,modal.rate)+'</p>';
    h+='<label class="l" for="m-item">Place or activity</label><select id="m-item">'+placeOptions(dr.item)+'</select>';
    h+='<label class="l">Paid with</label><div class="seg"><button data-act="pay" data-id="card" aria-pressed="'+(dr.pay==="card")+'">Card</button><button data-act="pay" data-id="cash" aria-pressed="'+(dr.pay==="cash")+'">Cash</button></div>';
    h+='<label class="l">Photos and receipts</label>';
    if(dr.photos.length){
      h+='<div class="thumbs" style="margin:0 0 10px">';
      dr.photos.forEach(function(p){h+='<div class="thumb"><button class="thumb" data-act="photo" data-id="'+p+'" aria-label="View photo" style="border:0"><img data-pid="'+p+'" alt="Receipt"></button><button class="x" data-act="rmphoto" data-id="'+p+'" aria-label="Remove photo">&times;</button></div>'});
      h+='</div>';
    }
    h+='<label class="btn ghost wide" for="m-files" tabindex="0">+ Add photo or receipt</label><input id="m-files" type="file" accept="image/*" multiple style="display:none">';
    h+='<p class="hint" id="m-msg"></p>';
    h+='<div class="actions">'+(modal.id?'<button class="btn danger spacer" data-act="m-delexp">Delete</button>':'')+'<button class="btn ghost" data-act="m-close">Cancel</button><button class="btn" data-act="m-saveexp">Save</button></div>';
  }else if(modal.type==="photo"){
    h+='<h3>Photo</h3><div class="viewer"><img data-pid="'+modal.id+'" alt="Receipt photo"></div><div class="actions"><button class="btn" data-act="m-close">Close</button></div>';
  }else if(modal.type==="data"){
    h+='<h3>Back up or restore</h3><p class="hint" style="margin-top:0">Copy this text and save it somewhere safe (notes app, email to yourself). To restore, paste it back and tap Restore. Photos are not included.</p>';
    h+='<textarea id="m-data" style="min-height:200px;font-size:.8rem">'+esc(JSON.stringify(S))+'</textarea>';
    h+='<div class="actions"><button class="btn ghost spacer" data-act="m-copy">Copy</button><button class="btn ghost" data-act="m-close">Close</button><button class="btn" data-act="m-restore">Restore</button></div><p class="hint" id="m-msg"></p>';
  }
  var s=document.createElement("div");s.className="scrim";s.id="scrim";
  s.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+h+'</div>';
  s.addEventListener("click",function(e){if(e.target===s)closeModal()});
  document.body.appendChild(s);
  hydrate();
}
function audPreview(jpy,rate){
  var n=parseFloat(jpy);
  if(!n||n<=0)return "AUD value appears here (1 AUD = \u00A5"+rate+")";
  return "about "+aud(n/rate)+" at 1 AUD = \u00A5"+rate;
}

/* ---------- actions ---------- */
function findItem(c,id){for(var i=0;i<c.items.length;i++)if(c.items[i].id===id)return i;return -1}
function visible(c){var vk=viewKey(c);return c.items.filter(function(i){return (vk==="ideas"?!i.day:i.day===vk)&&(!filter||i.cat===filter)})}
function swap(id,dir){
  var c=city(), vis=visible(c), p=-1;
  for(var i=0;i<vis.length;i++)if(vis[i].id===id)p=i;
  var q=p+dir; if(p<0||q<0||q>=vis.length)return;
  var a=findItem(c,vis[p].id), b=findItem(c,vis[q].id), t=c.items[a];c.items[a]=c.items[b];c.items[b]=t;
}
function val(id){var e=document.getElementById(id);return e?e.value:""}
function expIndex(id){for(var i=0;i<S.expenses.length;i++)if(S.expenses[i].id===id)return i;return -1}

function act(a,id){
  var c=city();
  switch(a){
    case "mode": S.mode=id;modal=null;break;
    case "city": S.active=id;S.view="ideas";filter=null;break;
    case "newcity": return openModal({type:"city"});
    case "editcity": return openModal({type:"city",id:c.id});
    case "view": S.view=id;break;
    case "newday": return openModal({type:"day"});
    case "editday": return openModal({type:"day",id:viewKey(c)});
    case "filter": filter=(filter===id)?null:id;break;
    case "add":
      var t=val("qa").trim(); if(!t){var q=document.getElementById("qa");if(q)q.focus();return}
      var vk=viewKey(c);
      c.items.push({id:uid(),title:t,cat:val("qc")||"sights",time:"",note:"",url:"",map:"",day:vk==="ideas"?null:vk,done:false});
      break;
    case "done": var i=findItem(c,id); if(i>-1)c.items[i].done=!c.items[i].done; break;
    case "up": swap(id,-1);break;
    case "down": swap(id,1);break;
    case "edit": return openModal({type:"item",id:id});
    case "sort":
      var vk2=viewKey(c), idxs=[], arr=[];
      c.items.forEach(function(it,n){if(it.day===vk2){idxs.push(n);arr.push(it)}});
      arr.sort(function(x,y){if(!x.time&&!y.time)return 0;if(!x.time)return 1;if(!y.time)return -1;return x.time<y.time?-1:x.time>y.time?1:0});
      idxs.forEach(function(n,k){c.items[n]=arr[k]});
      break;
    case "data": return openModal({type:"data"});
    case "m-close": return closeModal();
    case "m-saveitem":
      var j=findItem(c,modal.id); if(j>-1){var it=c.items[j];
        it.title=val("m-title").trim()||it.title; it.cat=val("m-cat"); it.time=val("m-time");
        it.note=val("m-note").trim(); it.url=val("m-url").trim(); it.map=cleanMap(val("m-map")); it.day=val("m-where")||null;}
      modal=null;break;
    case "m-delitem":
      var k2=findItem(c,modal.id); if(k2>-1)c.items.splice(k2,1);
      S.expenses.forEach(function(e){if(e.item===modal.id)e.item=null});
      modal=null;break;
    case "m-saveday":
      var lbl=val("m-label").trim()||("Day "+(c.days.length+1)), dt=val("m-date");
      if(modal.id){var d=dayOf(c,modal.id);if(d){d.label=lbl;d.date=dt}}
      else{var nd={id:uid(),label:lbl,date:dt};c.days.push(nd);S.view=nd.id}
      modal=null;break;
    case "m-delday":
      c.items.forEach(function(it){if(it.day===modal.id)it.day=null});
      c.days=c.days.filter(function(d){return d.id!==modal.id}); S.view="ideas"; modal=null;break;
    case "m-savecity":
      var nm=val("m-name").trim(); if(!nm)return;
      if(modal.id){c.name=nm}
      else{var nc={id:uid(),name:nm,days:[],items:[]};S.cities.push(nc);S.active=nc.id;S.view="ideas"}
      modal=null;break;
    case "m-delcity":
      var gone={};c.items.forEach(function(i){gone[i.id]=1});
      S.expenses.forEach(function(e){if(e.item&&gone[e.item])e.item=null});
      S.cities=S.cities.filter(function(x){return x.id!==c.id}); S.active=S.cities[0].id; S.view="ideas"; modal=null;break;

    /* expenses */
    case "newexp":
      return openModal({type:"expense",id:null,rate:S.rate,added:[],orig:[],draft:{desc:"",jpy:"",date:today(),pay:"card",item:"",photos:[]}});
    case "expfor":
      var fx=findAny(id); if(!fx)return;
      return openModal({type:"expense",id:null,rate:S.rate,added:[],orig:[],draft:{desc:fx.item.title,jpy:"",date:today(),pay:"card",item:id,photos:[]}});
    case "editexp":
      var ei=expIndex(id); if(ei<0)return; var ex=S.expenses[ei];
      return openModal({type:"expense",id:id,rate:ex.rate||S.rate,added:[],orig:(ex.photos||[]).slice(),
        draft:{desc:ex.desc,jpy:String(ex.jpy),date:ex.date,item:ex.item||"",pay:ex.pay==="cash"?"cash":"card",photos:(ex.photos||[]).slice()}});
    case "pay":
      capture(); modal.draft.pay=id; return renderModal();
    case "rmphoto":
      capture(); modal.draft.photos=modal.draft.photos.filter(function(p){return p!==id}); return renderModal();
    case "photo":
      capture(); return openModal({type:"photo",id:id,prev:modal&&modal.type==="expense"?modal:null});
    case "m-saveexp":
      capture();
      var dd=modal.draft, amt=Math.round(parseFloat(dd.jpy));
      if(!amt||amt<=0){var mm=document.getElementById("m-msg");if(mm)mm.textContent="Enter an amount in yen.";return}
      var rec={id:modal.id||uid(),desc:(dd.desc||"").trim(),jpy:amt,pay:dd.pay,date:dd.date||today(),rate:modal.rate,item:(dd.item&&findAny(dd.item))?dd.item:null,photos:dd.photos.slice()};
      var all=modal.orig.concat(modal.added);
      all.forEach(function(p){if(rec.photos.indexOf(p)<0)delPhoto(p)});
      if(modal.id){S.expenses[expIndex(modal.id)]=rec}else{S.expenses.push(rec)}
      modal=null;break;
    case "m-delexp":
      var di=expIndex(modal.id); if(di>-1){(S.expenses[di].photos||[]).forEach(delPhoto);S.expenses.splice(di,1)}
      (modal.added||[]).forEach(delPhoto);
      modal=null;break;

    case "m-copy":
      var ta=document.getElementById("m-data"), msg=document.getElementById("m-msg");
      try{ta.select();navigator.clipboard.writeText(ta.value).then(function(){msg.textContent="Copied."},function(){msg.textContent="Select the text and copy it manually."})}catch(e){msg.textContent="Select the text and copy it manually."}
      return;
    case "m-restore":
      var msg2=document.getElementById("m-msg");
      try{var o=JSON.parse(val("m-data")); if(!o||!o.cities||!o.cities.length)throw 0; S=normalize(o); S.active=S.cities[0].id; S.view="ideas"; modal=null;}
      catch(e){msg2.textContent="That text isn't a valid backup.";return}
      break;
  }
  save();render();
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el)return;
  if(el.tagName==="A")e.preventDefault();
  act(el.getAttribute("data-act"),el.getAttribute("data-id"));
});
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="m-jpy"&&modal&&modal.type==="expense"){
    var p=document.getElementById("m-aud");if(p)p.textContent=audPreview(e.target.value,modal.rate);
  }
});
document.addEventListener("change",function(e){
  var t=e.target; if(!t)return;
  if(t.id==="trip"){S.trip=t.value.trim()||"My Japan trip";save()}
  else if(t.id==="rate"){var r=parseFloat(t.value);if(r>0){S.rate=r;save()}render()}
  else if(t.id==="m-files"&&modal&&modal.type==="expense"){
    var files=Array.prototype.slice.call(t.files||[]);if(!files.length)return;
    capture();
    var msg=document.getElementById("m-msg");if(msg)msg.textContent="Adding photo"+(files.length>1?"s":"")+"...";
    var m=modal;
    Promise.all(files.map(function(f){
      return compress(f).then(function(b){var id="p"+uid();return putPhoto(id,b).then(function(){return id})});
    })).then(function(ids){
      ids.forEach(function(id){m.draft.photos.push(id);m.added.push(id)});
      if(modal===m)renderModal();
    }).catch(function(){
      var mm=document.getElementById("m-msg");if(mm)mm.textContent="Couldn't add that photo. Photo storage may be blocked in this browser.";
    });
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&modal)closeModal();
  if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.getAttribute&&e.target.getAttribute("for")==="m-files"){e.preventDefault();var f=document.getElementById("m-files");if(f)f.click()}
});
render();
})();
</script>
</body>
</html>
